<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Scraper</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card-bg: #1f1f1f;
      --text: #f1f1f1;
      --text-muted: #aaaaaa;
      --accent: #ff0033;
      --accent-hover: #cc0029;
      --success: #2ba640;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-logo {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-badge {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
      border: 1px solid var(--border);
    }

    .status-badge.error {
      color: #ff6b6b;
      background-color: #2a1515;
      border-color: #552222;
    }

    .status-badge.success {
      color: #4ade80;
      background-color: #122818;
      border-color: #1e4d29;
    }

    button#scrapeBtn {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    button#scrapeBtn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    button#scrapeBtn:active:not(:disabled) {
      transform: scale(0.98);
    }

    button#scrapeBtn:disabled {
      background-color: #333333;
      color: #777777;
      cursor: not-allowed;
    }

    .progress-box {
      display: none;
      margin-top: 12px;
      font-size: 12px;
      color: #3ea6ff;
      text-align: center;
      padding: 8px;
      background: #121c26;
      border-radius: 6px;
      border: 1px solid #1a3652;
    }

    .result-box {
      display: none;
      margin-top: 12px;
    }

    .result-msg {
      font-size: 12px;
      font-weight: 600;
      color: #4ade80;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    textarea#preview {
      width: 100%;
      height: 110px;
      background-color: #141414;
      color: #c9c9c9;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      font-family: Menlo, Monaco, Consolas, monospace;
      resize: none;
      outline: none;
      line-height: 1.4;
    }

    .copy-again-btn {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      background-color: #262626;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .copy-again-btn:hover {
      background-color: #333333;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">▶</div>
    <div class="header-title">YouTube Scraper</div>
  </div>

  <div id="statusBadge" class="status-badge">
    Đang kiểm tra tab...
  </div>

  <button id="scrapeBtn" disabled>
    📋 Cào & Copy
  </button>

  <div id="progressBox" class="progress-box">
    Đang chuẩn bị...
  </div>

  <div id="resultBox" class="result-box">
    <div class="result-msg">✅ Đã copy vào clipboard! Sẵn sàng paste vào AI.</div>
    <textarea id="preview" readonly></textarea>
    <button id="copyAgainBtn" class="copy-again-btn">📋 Copy lại</button>
    <button id="saveFileBtn" class="copy-again-btn" style="margin-top:4px; background-color:#1a3652; border-color:#264d73;">💾 Lưu file</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
